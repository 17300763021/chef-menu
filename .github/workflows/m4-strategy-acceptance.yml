name: M4 Explainable Baseline Strategy Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "M4 deterministic contracts, Qlib smoke, or the one pinned full-release acceptance"
        required: true
        default: deterministic
        type: choice
        options: [deterministic, framework-smoke, formal-release]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m4-strategy-acceptance.yml
      - scripts/strategy/**
      - scripts/test_m4_*.py
      - scripts/market_data/tidb_checkpoint_store.py
      - scripts/framework-requirements.txt
      - .python-version

permissions:
  contents: read

concurrency:
  group: m4-baseline-strategy-${{ github.event_name }}-${{ inputs.mode || 'deterministic' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install deterministic research dependencies
        run: python -m pip install "numpy==2.3.5" "pandas==3.0.3"
      - name: Verify M4 contracts, formulas, regime, and portfolio boundaries
        run: |
          python -m scripts.test_m4_baseline_contracts
          python -m scripts.test_m4_strategy_research
          python -m scripts.strategy.acceptance_report --output m4-evidence/deterministic.json
      - name: Preserve non-authoritative deterministic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m4-deterministic-contracts-${{ github.run_id }}
          path: m4-evidence/deterministic.json
          retention-days: 30
          if-no-files-found: error

  qlib-public-api-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'framework-smoke' || inputs.mode == 'formal-release'))
    needs: deterministic-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/framework-requirements.txt
      - name: Install pinned Qlib research framework
        run: python -m pip install "pyqlib==0.9.7"
      - name: Bind exact accepted full research release across isolated warehouses
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'formal-release'
        env:
          TIDB_HOST: ${{ secrets.TIDB_RESEARCH_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_RESEARCH_PORT }}
          TIDB_USER: ${{ secrets.TIDB_RESEARCH_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_RESEARCH_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_RESEARCH_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_RESEARCH_SSL_MODE }}
          TIDB_MARKET_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_MARKET_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_MARKET_USER: ${{ secrets.TIDB_USER }}
          TIDB_MARKET_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_MARKET_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_MARKET_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.strategy.research_release_gate
          --binding scripts/strategy/specs/m4_research_release_2026_07_28.json
          --output m4-evidence/research-release.json
      - name: Verify public DatasetH, DataHandlerLP, and Model path
        run: |
          python -m scripts.test_m4_strategy_research
          python -m scripts.strategy.acceptance_report --require-qlib --output m4-evidence/qlib-framework.json
      - name: Create release-bound formal Qlib evidence
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'formal-release'
        run: >-
          python -m scripts.strategy.acceptance_report --require-qlib --require-full-release
          --research-release m4-evidence/research-release.json
          --output m4-evidence/qlib-formal-release.json
      - name: Preserve non-authoritative Qlib framework evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m4-qlib-framework-${{ github.run_id }}
          path: m4-evidence/qlib-framework.json
          retention-days: 30
          if-no-files-found: error
