name: M4 Explainable Baseline Strategy Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "M4 deterministic contracts or pinned Qlib public API smoke"
        required: true
        default: deterministic
        type: choice
        options: [deterministic, framework-smoke]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m4-strategy-acceptance.yml
      - scripts/strategy/**
      - scripts/test_m4_*.py
      - scripts/framework-requirements.txt
      - .python-version

permissions:
  contents: read

concurrency:
  group: m4-baseline-strategy-${{ github.event_name }}-${{ inputs.mode || 'deterministic' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install deterministic research dependencies
        run: python -m pip install "numpy==2.3.5" "pandas==3.0.3"
      - name: Verify M4 contracts, formulas, regime, and portfolio boundaries
        run: |
          python -m scripts.test_m4_baseline_contracts
          python -m scripts.test_m4_strategy_research
          python -m scripts.strategy.acceptance_report --output m4-evidence/deterministic.json
      - name: Preserve non-authoritative deterministic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m4-deterministic-contracts-${{ github.run_id }}
          path: m4-evidence/deterministic.json
          retention-days: 30
          if-no-files-found: error

  qlib-public-api-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'framework-smoke')
    needs: deterministic-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/framework-requirements.txt
      - name: Install pinned Qlib research framework
        run: python -m pip install "pyqlib==0.9.7"
      - name: Verify public DatasetH, DataHandlerLP, and Model path
        run: |
          python -m scripts.test_m4_strategy_research
          python -m scripts.strategy.acceptance_report --require-qlib --output m4-evidence/qlib-framework.json
      - name: Preserve non-authoritative Qlib framework evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m4-qlib-framework-${{ github.run_id }}
          path: m4-evidence/qlib-framework.json
          retention-days: 30
          if-no-files-found: error
