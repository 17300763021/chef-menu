name: M3 RQAlpha Simulation Ledger Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "M3 contracts, engine, disabled ledger, continuity, or shadow parity acceptance"
        required: true
        default: deterministic
        type: choice
        options: [deterministic, framework-smoke, ledger-online, continuity-online, shadow-parity-online]
  pull_request:
    branches: [main, codex/m2-industry-pit]
    paths:
      - .github/workflows/rqalpha-simulation-acceptance.yml
      - scripts/simulation/**
      - scripts/test_v2_simulation_*.py
      - scripts/test_v2_rqalpha_*.py
      - scripts/framework-requirements.txt
      - supabase/migrations/20260812090000_add_v2_simulation_ledger.sql
      - .python-version

permissions:
  contents: read

concurrency:
  group: m3-rqalpha-ledger-${{ github.event_name }}-${{ inputs.mode || 'deterministic' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Verify disabled simulation contracts, reconciliation, and schema
        run: |
          python -m scripts.test_v2_simulation_contracts
          python -m scripts.test_v2_simulation_data_adapter
          python -m scripts.test_v2_simulation_history_adapter
          python -m scripts.test_v2_simulation_reconciliation
          python -m scripts.test_v2_simulation_ledger_acceptance
          python -m scripts.test_v2_simulation_ledger_continuity
          python -m scripts.test_v2_simulation_shadow_parity
          python -m scripts.test_v2_simulation_schema
          python -m scripts.test_cloud_runtime

  framework-public-api-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'framework-smoke' || inputs.mode == 'ledger-online' || inputs.mode == 'continuity-online' || inputs.mode == 'shadow-parity-online'))
    needs: deterministic-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/framework-requirements.txt
      - name: Install pinned RQAlpha for isolated backtest acceptance
        run: python -m pip install "rqalpha==6.2.1"
      - name: Verify pinned public API only
        run: |
          python - <<'PY'
          import inspect
          from importlib.metadata import version
          from rqalpha import run_func
          from rqalpha.api import order_shares
          from rqalpha.environment import Environment
          from rqalpha.interface import AbstractDataSource
          assert version("rqalpha") == "6.2.1"
          assert "config" in inspect.getdoc(run_func)
          assert list(inspect.signature(order_shares).parameters)[:2] == ["id_or_ins", "amount"]
          assert hasattr(Environment, "set_data_source")
          assert "get_dividend" in AbstractDataSource.__dict__
          print("RQAlpha 6.2.1 public data and order APIs accepted; no simulation account was activated")
          PY
      - name: Execute M2 corporate-action regression through RQAlpha accounting
        run: python -m scripts.test_v2_rqalpha_corporate_action_execution
      - name: Execute deterministic orders, fills, and independent reconciliation
        run: python -m scripts.test_v2_rqalpha_backtest_execution

  warehouse-backed-engine-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'framework-smoke'
    needs: [deterministic-contracts, framework-public-api-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install pinned engine and read-only warehouse client
        run: python -m pip install "rqalpha==6.2.1" "PyMySQL==1.1.1"
      - name: Extract six rows from explicitly pinned accepted M2 releases
        run: |
          python -m scripts.simulation.extract_m2_rqalpha_input --output m3-acceptance/m2-input.json
      - name: Run the same RQAlpha backtest twice
        run: |
          python -m scripts.simulation.rqalpha_backtest_runner \
            --input m3-acceptance/m2-input.json --output m3-acceptance/result-1.json
          python -m scripts.simulation.rqalpha_backtest_runner \
            --input m3-acceptance/m2-input.json --output m3-acceptance/result-2.json
          cmp m3-acceptance/result-1.json m3-acceptance/result-2.json
      - name: Preserve compact non-authoritative evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-rqalpha-bounded-acceptance-${{ github.run_id }}
          path: m3-acceptance/
          retention-days: 7
          if-no-files-found: error

  disabled-online-ledger-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ledger-online'
    needs: [deterministic-contracts, framework-public-api-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install pinned engine and read-only warehouse client
        run: python -m pip install "rqalpha==6.2.1" "PyMySQL==1.1.1"
      - name: Extract the explicitly pinned bounded M2 input
        run: python -m scripts.simulation.extract_m2_rqalpha_input --output m3-ledger/m2-input.json
      - name: Publish once atomically, retry ten times, and verify immutable read-back
        run: >-
          python -m scripts.simulation.ledger_acceptance
          --input m3-ledger/m2-input.json
          --report-out m3-ledger/acceptance-report.json
      - name: Preserve compact non-sensitive online-ledger evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-disabled-online-ledger-${{ github.run_id }}
          path: m3-ledger/acceptance-report.json
          retention-days: 30
          if-no-files-found: error

  disabled-two-day-continuity-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'continuity-online'
    needs: [deterministic-contracts, framework-public-api-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install pinned engine and read-only warehouse client
        run: python -m pip install "rqalpha==6.2.1" "PyMySQL==1.1.1"
      - name: Extract the explicitly pinned two-day M2 input
        run: python -m scripts.simulation.extract_m2_rqalpha_input --output m3-continuity/m2-input.json
      - name: Publish and verify two consecutive disabled account days
        run: >-
          python -m scripts.simulation.ledger_continuity_acceptance
          --input m3-continuity/m2-input.json
          --report-out m3-continuity/acceptance-report.json
      - name: Preserve compact non-sensitive continuity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-disabled-continuity-${{ github.run_id }}
          path: m3-continuity/acceptance-report.json
          retention-days: 30
          if-no-files-found: error

  disabled-shadow-parity-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'shadow-parity-online'
    needs: [deterministic-contracts, framework-public-api-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install pinned engine and read-only warehouse client
        run: python -m pip install "rqalpha==6.2.1" "PyMySQL==1.1.1"
      - name: Extract the same immutable M2 input for both execution paths
        run: python -m scripts.simulation.extract_m2_rqalpha_input --output m3-shadow-parity/m2-input.json
      - name: Compare independent RQAlpha runs and publish only the disabled shadow rehearsal
        run: >-
          python -m scripts.simulation.shadow_parity_acceptance
          --input m3-shadow-parity/m2-input.json
          --report-out m3-shadow-parity/acceptance-report.json
      - name: Preserve compact non-sensitive shadow-parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-disabled-shadow-parity-${{ github.run_id }}
          path: m3-shadow-parity/acceptance-report.json
          retention-days: 30
          if-no-files-found: error
