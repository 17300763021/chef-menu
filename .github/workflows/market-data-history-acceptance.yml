name: M2 Historical Market Data Acceptance

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Inclusive acceptance end date; blank uses runner yesterday"
        required: false
        type: string
      mode:
        description: "smoke uses 20 symbols/2 shards; preflight uses 100; full is the formal universe acceptance"
        required: true
        default: sample
        type: choice
        options: [smoke, preflight, full, sample]
      publish_tidb:
        description: "Publish completed evidence/checkpoints to TiDB using repository secrets"
        required: false
        default: true
        type: boolean
      operation:
        description: "capture starts a new scope; resume repairs one frozen prior full run and finalizes from TiDB"
        required: true
        default: capture
        type: choice
        options: [capture, resume]
      resume_run_id:
        description: "Required for resume: GitHub run id containing the original frozen shard plan"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/market-data-history-acceptance.yml
      - scripts/market_data/**
      - scripts/test_historical_market_data.py
      - scripts/test_historical_quality_gates.py
      - scripts/test_merge_historical_shards.py
      - scripts/test_tidb_checkpoint_store.py
      - scripts/test_adjustment_engine.py
      - scripts/test_tradeability.py
      - scripts/test_market_data_m2_workflows.py
      - .python-version

permissions:
  contents: read
  actions: read

concurrency:
  group: m2-historical-market-data-${{ github.event_name }}-${{ inputs.mode || 'sample' }}-${{ inputs.operation || 'capture' }}
  cancel-in-progress: false

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - name: Install pinned M2 dependencies
        run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Run deterministic M2.3 and prerequisite tests
        run: |
          python -m scripts.test_market_data_contracts
          python -m scripts.test_market_data_quality
          python -m scripts.test_market_calendar
          python -m scripts.test_point_in_time_universe
          python -m scripts.test_historical_market_data
          python -m scripts.test_historical_quality_gates
          python -m scripts.test_merge_historical_shards
          python -m scripts.test_tidb_checkpoint_store
          python -m scripts.test_adjustment_engine
          python -m scripts.test_tradeability
          python -m scripts.test_baostock_calendar_source
          python -m scripts.test_eastmoney_market_state_source
          python -m scripts.test_baostock_history_source
          python -m scripts.test_market_data_m2_workflows

  sample:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sample' && inputs.operation == 'capture'
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Select sample end date
        id: acceptance
        env:
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: echo "end_date=${INPUT_END_DATE:-$(date -u -d 'yesterday' +%F)}" >> "$GITHUB_OUTPUT"
      - name: Build observable sample evidence
        id: capture
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tidb }}
        env:
          TIDB_CHECKPOINT_DATASET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tidb && format('gh-{0}-sample-{1}', github.run_id, steps.acceptance.outputs.end_date) || '' }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ steps.acceptance.outputs.end_date }}"
          --mode sample
          --output-dir historical-market-sample
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Retry only failed or missing sample symbols from TiDB checkpoint
        if: steps.capture.outcome == 'failure' && github.event_name == 'workflow_dispatch' && inputs.publish_tidb
        env:
          TIDB_CHECKPOINT_DATASET_ID: gh-${{ github.run_id }}-sample-${{ steps.acceptance.outputs.end_date }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ steps.acceptance.outputs.end_date }}"
          --mode sample
          --output-dir historical-market-sample
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Publish sample checkpoint to TiDB
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_tidb
        env:
          TIDB_CHECKPOINT_DATASET_ID: gh-${{ github.run_id }}-sample-${{ steps.acceptance.outputs.end_date }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.publish_historical_to_tidb
          --input-dir historical-market-sample
          --dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
          --init-schema
          --allow-unaccepted-checkpoint
          --missing-input-ok
      - name: Upload sample evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-sample-${{ github.sha }}-${{ steps.acceptance.outputs.end_date }}
          path: historical-market-sample/*
          if-no-files-found: warn
          retention-days: 30

  plan:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode != 'sample' || inputs.operation == 'resume')
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      mode: ${{ steps.export.outputs.mode }}
      end_date: ${{ steps.export.outputs.end_date }}
      checkpoint_scope_sha256: ${{ steps.export.outputs.checkpoint_scope_sha256 }}
      repair_matrix: ${{ steps.export.outputs.repair_matrix }}
      repair_required: ${{ steps.export.outputs.repair_required }}
      repair_shard_count: ${{ steps.export.outputs.repair_shard_count }}
      repair_symbol_count: ${{ steps.export.outputs.repair_symbol_count }}
      resumable_symbol_count: ${{ steps.export.outputs.resumable_symbol_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Select acceptance end date
        id: date
        env:
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: echo "end_date=${INPUT_END_DATE:-$(date -u -d 'yesterday' +%F)}" >> "$GITHUB_OUTPUT"
      - name: Validate resume inputs
        if: inputs.operation == 'resume'
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          PUBLISH_TIDB: ${{ inputs.publish_tidb }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || { echo "resume_run_id must be a numeric GitHub run id"; exit 2; }
          [[ "$PUBLISH_TIDB" == "true" ]] || { echo "resume requires TiDB checkpoints"; exit 2; }
      - name: Download original frozen shard plan
        if: inputs.operation == 'resume'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m2-history-plan-${{ inputs.resume_run_id }}
          path: original-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Resolve frozen business end
        id: scope
        env:
          OPERATION: ${{ inputs.operation }}
          CAPTURE_END_DATE: ${{ steps.date.outputs.end_date }}
        run: |
          python - <<'PY'
          import json, os
          end_date = os.environ["CAPTURE_END_DATE"]
          if os.environ["OPERATION"] == "resume":
              end_date = json.load(open("original-plan/shard-plan.json", encoding="utf-8"))["business_end"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("end_date=" + end_date + "\n")
          PY
      - name: Build deterministic shard plan
        if: inputs.operation == 'capture'
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ steps.scope.outputs.end_date }}"
          --mode "${{ inputs.mode }}"
          --plan-output shard-plan.json
      - name: Build TiDB repair matrix from frozen plan
        if: inputs.operation == 'resume'
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ steps.scope.outputs.end_date }}"
          --mode "${{ inputs.mode }}"
          --plan-input original-plan/shard-plan.json
          --plan-output shard-plan.json
          --acquisition-policy repair
      - name: Export shard matrix
        id: export
        env:
          END_DATE: ${{ steps.scope.outputs.end_date }}
        run: |
          python - <<'PY'
          import json, os
          plan = json.load(open("shard-plan.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("matrix=" + json.dumps(plan["matrix"], separators=(",", ":")) + "\n")
              stream.write("mode=" + plan["mode"] + "\n")
              stream.write("end_date=" + os.environ["END_DATE"] + "\n")
              stream.write("checkpoint_scope_sha256=" + plan["checkpoint_scope_sha256"] + "\n")
              repair_matrix = plan.get("repair_matrix", {"include": []})
              repair_shards = int(plan.get("repair_shard_count", 0))
              stream.write("repair_matrix=" + json.dumps(repair_matrix, separators=(",", ":")) + "\n")
              stream.write("repair_required=" + ("true" if repair_shards else "false") + "\n")
              stream.write("repair_shard_count=" + str(repair_shards) + "\n")
              stream.write("repair_symbol_count=" + str(plan.get("repair_symbol_count", 0)) + "\n")
              stream.write("resumable_symbol_count=" + str(plan.get("resumable_symbol_count", 0)) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-plan-${{ github.run_id }}
          path: shard-plan.json
          retention-days: 90

  shard:
    if: inputs.operation == 'capture'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Download fixed shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m2-history-plan-${{ github.run_id }}
          path: shard-plan
      - name: Build observable shard
        id: capture
        continue-on-error: ${{ inputs.publish_tidb }}
        env:
          TIDB_CHECKPOINT_DATASET_ID: ${{ inputs.publish_tidb && format('m2-{0}-{1}-{2}-shard-{3}-of-{4}', needs.plan.outputs.mode, needs.plan.outputs.end_date, needs.plan.outputs.checkpoint_scope_sha256, matrix.shard_index, matrix.shard_count) || '' }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --output-dir "historical-shard-${{ matrix.shard_index }}"
          --acquisition-policy capture
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Retry only failed or missing symbols from TiDB checkpoint
        if: steps.capture.outcome == 'failure' && inputs.publish_tidb
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --output-dir "historical-shard-${{ matrix.shard_index }}"
          --acquisition-policy capture
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Publish shard checkpoint to TiDB
        if: always() && inputs.publish_tidb
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.publish_historical_to_tidb
          --input-dir "historical-shard-${{ matrix.shard_index }}"
          --dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
          --init-schema
          --allow-unaccepted-checkpoint
          --missing-input-ok
      - name: Upload completed shard checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-shard-${{ github.run_id }}-${{ matrix.shard_index }}
          path: historical-shard-${{ matrix.shard_index }}/*
          if-no-files-found: warn
          retention-days: 30

  repair-shard:
    if: inputs.operation == 'resume' && needs.plan.outputs.repair_required == 'true'
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.repair_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Download fixed repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m2-history-plan-${{ github.run_id }}
          path: shard-plan
      - name: Repair only failed or missing symbols
        id: repair
        continue-on-error: true
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --output-dir "historical-repair-${{ matrix.shard_index }}"
          --acquisition-policy repair
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Retry remaining failed symbols once
        id: retry
        if: steps.repair.outcome == 'failure'
        continue-on-error: true
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --output-dir "historical-repair-${{ matrix.shard_index }}"
          --acquisition-policy repair
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Register repaired physical shard without rewriting market rows
        if: steps.repair.outcome == 'success' || steps.retry.outcome == 'success'
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.publish_historical_to_tidb
          --input-dir "historical-repair-${{ matrix.shard_index }}"
          --dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
          --checkpoint-manifest-only
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-repair-${{ github.run_id }}-${{ matrix.shard_index }}
          path: historical-repair-${{ matrix.shard_index }}/manifest.json
          if-no-files-found: warn
          retention-days: 30

  resume-diagnostics:
    if: always() && inputs.operation == 'resume' && needs.plan.result == 'success'
    needs: [plan, repair-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      remaining_symbol_count: ${{ steps.export.outputs.remaining_symbol_count }}
      remaining_shard_count: ${{ steps.export.outputs.remaining_shard_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Download fixed repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m2-history-plan-${{ github.run_id }}
          path: shard-plan
      - name: Reconcile all checkpoint quality after repair attempts
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --plan-output remaining-plan.json
          --acquisition-policy repair
      - name: Export aggregate repair diagnosis
        id: export
        run: |
          python - <<'PY'
          import json, os
          plan = json.load(open("remaining-plan.json", encoding="utf-8"))
          remaining = int(plan.get("repair_symbol_count", 0))
          shards = int(plan.get("repair_shard_count", 0))
          details = plan.get("repair_details", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"remaining_symbol_count={remaining}\n")
              stream.write(f"remaining_shard_count={shards}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(f"## M2.3 resume diagnosis\n\nRemaining symbols: **{remaining}** across **{shards}** shards.\n")
              if details:
                  stream.write("\n```text\n" + "\n".join(details) + "\n```\n")
          PY
      - name: Upload aggregate repair diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-resume-diagnostics-${{ github.run_id }}
          path: remaining-plan.json
          retention-days: 30

  resume-repair-gate:
    if: always() && inputs.operation == 'resume'
    needs: [plan, resume-diagnostics]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce one aggregate resume outcome
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DIAGNOSTICS_RESULT: ${{ needs.resume-diagnostics.result }}
          REMAINING_SYMBOLS: ${{ needs.resume-diagnostics.outputs.remaining_symbol_count }}
        run: |
          [[ "$PLAN_RESULT" == "success" ]] || { echo "Frozen plan failed"; exit 1; }
          [[ "$DIAGNOSTICS_RESULT" == "success" ]] || { echo "Aggregate TiDB diagnosis failed"; exit 1; }
          [[ "$REMAINING_SYMBOLS" == "0" ]] || { echo "$REMAINING_SYMBOLS symbols remain incomplete; inspect the aggregate diagnosis artifact"; exit 1; }

  finalize-shard:
    if: always() && inputs.operation == 'resume' && needs.resume-repair-gate.result == 'success'
    needs: [plan, repair-shard, resume-diagnostics, resume-repair-gate]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Download fixed repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m2-history-plan-${{ github.run_id }}
          path: shard-plan
      - name: Finalize shard from TiDB with public market data disabled
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.historical_bars
          --end-date "${{ needs.plan.outputs.end_date }}"
          --mode "${{ needs.plan.outputs.mode }}"
          --plan-input shard-plan/shard-plan.json
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --output-dir "historical-shard-${{ matrix.shard_index }}"
          --acquisition-policy finalize
          --tidb-checkpoint-dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
      - name: Register finalized physical shard without rewriting market rows
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.publish_historical_to_tidb
          --input-dir "historical-shard-${{ matrix.shard_index }}"
          --dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
          --checkpoint-manifest-only
      - name: Upload finalized shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-shard-${{ github.run_id }}-${{ matrix.shard_index }}
          path: historical-shard-${{ matrix.shard_index }}/*
          if-no-files-found: warn
          retention-days: 30

  merge:
    if: >-
      always() && needs.plan.result == 'success' &&
      ((inputs.operation == 'capture' && needs.shard.result == 'success') ||
       (inputs.operation == 'resume' && needs.finalize-shard.result == 'success'))
    needs: [plan, shard, repair-shard, resume-diagnostics, resume-repair-gate, finalize-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Download accepted shard checkpoints
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: m2-history-shard-${{ github.run_id }}-*
          path: downloaded-shards
      - name: Merge available checkpoints and enforce global gates
        run: >-
          python -u -m scripts.market_data.merge_historical_shards
          --input-dir downloaded-shards
          --output-dir historical-market-acceptance
      - name: Publish merged accepted evidence to TiDB
        if: success() && inputs.publish_tidb
        env:
          TIDB_CHECKPOINT_DATASET_ID: m2-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.end_date }}-${{ needs.plan.outputs.checkpoint_scope_sha256 }}-merged
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.publish_historical_to_tidb
          --input-dir historical-market-acceptance
          --dataset-id "$TIDB_CHECKPOINT_DATASET_ID"
          --init-schema
          --manifest-only
      - name: Upload merged non-authoritative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-history-merged-${{ github.run_id }}-${{ needs.plan.outputs.mode }}
          path: historical-market-acceptance/manifest.json
          if-no-files-found: warn
          retention-days: 30
