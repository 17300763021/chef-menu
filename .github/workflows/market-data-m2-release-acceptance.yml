name: M2 Data Release Acceptance

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: "Business date all required M2 components must cover"
        required: true
        type: string
      mysql_storage_capacity_percent:
        description: "Manually attested MySQL storage-capacity percentage (0-100)"
        required: true
        type: string
      mysql_capacity_checked_at:
        description: "Date MySQL storage capacity was checked (YYYY-MM-DD, no older than 7 days)"
        required: true
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: m2-data-release
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - run: |
          python -m scripts.test_market_data_m2_workflows
          python -m scripts.test_market_data_m2_release

  quota-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Enforce fresh MySQL storage-capacity attestation below 80 percent
        run: >-
          python -m scripts.market_data.industry_quota_guard
          --storage-percent "${{ inputs.mysql_storage_capacity_percent }}"
          --checked-at "${{ inputs.mysql_capacity_checked_at }}"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [deterministic-tests, quota-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Bind independently accepted components into one research-only release
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_SSL_MODE: ${{ secrets.MYSQL_SSL_MODE }}
        run: python -u -m scripts.market_data.m2_release_gate --business-date "${{ inputs.business_date }}" --output-dir m2-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-data-release-${{ github.run_id }}
          path: m2-release/manifest.json
          retention-days: 30
