name: M2 Point-In-Time Fundamental Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample validates 20 symbols; full validates the frozen 1,403-symbol scope"
        required: true
        default: sample
        type: choice
        options: [sample, full]
      as_of_date:
        description: "Frozen knowledge date (YYYY-MM-DD); blank uses current Shanghai date"
        required: false
        type: string
      tidb_ru_percent:
        description: "Current TiDB monthly Request Units percentage"
        required: true
        type: string
      tidb_storage_percent:
        description: "Current TiDB row-storage percentage"
        required: true
        type: string
      tidb_quota_checked_at:
        description: "Date both percentages were checked (YYYY-MM-DD, no older than 7 days)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/market-data-fundamental-acceptance.yml
      - scripts/market_data/fundamental_*.py
      - scripts/market_data/tidb_fundamental_store.py
      - scripts/market_data/sources/eastmoney_fundamental_source.py
      - scripts/market_data/sources/cninfo_announcement_source.py
      - scripts/test_market_data_fundamentals.py
      - scripts/market_data/requirements.lock.txt
      - .python-version
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m2-fundamental-${{ github.event_name }}-${{ inputs.mode || 'tests' }}-${{ inputs.as_of_date || 'current' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - run: |
          python -m scripts.test_market_data_fundamentals
          python -m scripts.test_market_data_industry
          python -m scripts.test_tidb_industry_store
          python -m scripts.test_historical_market_data

  prepare:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      as_of_date: ${{ steps.freeze.outputs.as_of_date }}
      matrix: ${{ steps.freeze.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Enforce fresh TiDB quota attestations below 80 percent
        run: >-
          python -m scripts.market_data.industry_quota_guard
          --ru-percent "${{ inputs.tidb_ru_percent }}"
          --storage-percent "${{ inputs.tidb_storage_percent }}"
          --checked-at "${{ inputs.tidb_quota_checked_at }}"
      - id: freeze
        env:
          INPUT_AS_OF_DATE: ${{ inputs.as_of_date }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          value = os.environ.get("INPUT_AS_OF_DATE", "").strip() or datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          count = 4 if os.environ["INPUT_MODE"] == "sample" else 16
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"as_of_date={value}\n")
              stream.write("matrix=" + json.dumps({"shard_index": list(range(count)), "shard_count": [count]}, separators=(",", ":")) + "\n")
          PY

  capture:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Capture resumable financial-statement checkpoints
        env:
          TIDB_HOST: ${{ secrets.TIDB_RESEARCH_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_RESEARCH_PORT }}
          TIDB_USER: ${{ secrets.TIDB_RESEARCH_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_RESEARCH_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_RESEARCH_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_RESEARCH_SSL_MODE }}
          TIDB_MARKET_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_MARKET_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_MARKET_USER: ${{ secrets.TIDB_USER }}
          TIDB_MARKET_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_MARKET_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_MARKET_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.fundamental_runner
          --operation capture --mode "${{ inputs.mode }}"
          --as-of-date "${{ needs.prepare.outputs.as_of_date }}"
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}" --attempts 2

  finalize:
    needs: [prepare, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - name: Validate global coverage and atomically publish
        env:
          TIDB_HOST: ${{ secrets.TIDB_RESEARCH_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_RESEARCH_PORT }}
          TIDB_USER: ${{ secrets.TIDB_RESEARCH_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_RESEARCH_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_RESEARCH_DATABASE }}
          TIDB_SSL_MODE: ${{ secrets.TIDB_RESEARCH_SSL_MODE }}
          TIDB_MARKET_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_MARKET_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_MARKET_USER: ${{ secrets.TIDB_USER }}
          TIDB_MARKET_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_MARKET_DATABASE: ${{ secrets.TIDB_DATABASE }}
          TIDB_MARKET_SSL_MODE: ${{ secrets.TIDB_SSL_MODE }}
        run: >-
          python -u -m scripts.market_data.fundamental_runner
          --operation finalize --mode "${{ inputs.mode }}"
          --as-of-date "${{ needs.prepare.outputs.as_of_date }}"
          --output-dir fundamental-acceptance
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-fundamental-manifest-${{ github.run_id }}
          path: fundamental-acceptance/manifest.json
          if-no-files-found: error
          retention-days: 7
