name: M2 Benchmark Index Acceptance

on:
  workflow_dispatch:
    inputs:
      business_end:
        description: "Latest completed trading session (YYYY-MM-DD)"
        required: true
        type: string
      mysql_storage_capacity_percent:
        description: "Manually attested MySQL storage-capacity percentage (0-100)"
        required: true
        type: string
      mysql_capacity_checked_at:
        description: "Fresh MySQL storage-capacity attestation date (YYYY-MM-DD)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/market-data-index-acceptance.yml
      - scripts/market_data/index_*.py
      - scripts/market_data/mysql_index_store.py
      - scripts/test_market_data_index_bars.py
      - scripts/test_mysql_index_store.py
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: m2-benchmark-index
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/market_data/requirements.lock.txt
      - run: python -m pip install -r scripts/market_data/requirements.lock.txt
      - run: python -m scripts.test_market_data_index_bars
      - run: python -m scripts.test_mysql_index_store
      - if: github.event_name == 'workflow_dispatch'
        run: >-
          python -m scripts.market_data.industry_quota_guard
          --storage-percent "${{ inputs.mysql_storage_capacity_percent }}"
          --checked-at "${{ inputs.mysql_capacity_checked_at }}"
      - if: github.event_name == 'workflow_dispatch'
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_SSL_MODE: ${{ secrets.MYSQL_SSL_MODE }}
        run: python -u -m scripts.market_data.index_runner --business-end "${{ inputs.business_end }}" --output-dir index-acceptance
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-index-manifest-${{ github.run_id }}
          path: index-acceptance/manifest.json
          retention-days: 7
